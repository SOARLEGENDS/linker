<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cooking Calculator 🍳</title>

<style>
    body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        background: #fff8e6;
        color: #3b2f2f;
    }

    header {
        background: #d2691e;
        color: #fff;
        padding: 20px;
        text-align: center;
        font-size: 26px;
        font-weight: bold;
        letter-spacing: 1px;
    }

    .container {
        max-width: 450px;
        margin: 40px auto;
        background: #ffffff;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        border: 3px solid #f2d2a9;
    }

    label {
        font-weight: 600;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-top: 5px;
        margin-bottom: 15px;
        border-radius: 10px;
        border: 2px solid #dba979;
        font-size: 16px;
    }

    button {
        width: 100%;
        padding: 12px;
        background: #d2691e;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 18px;
        cursor: pointer;
    }

    button:hover {
        background: #b85d1b;
    }

    .result {
        margin-top: 25px;
        padding: 15px;
        background: #ffe9c6;
        border-radius: 10px;
        font-size: 18px;
        border: 2px solid #e8c28a;
    }

    footer {
        text-align: center;
        margin-top: 25px;
        font-size: 14px;
        color: #6b4f3d;
        padding-bottom: 20px;
    }
</style>
</head>

<body>

<header>Chef’s Recipe Calculator 🍳</header>

<div class="container">
    <h2>Ingredient Multiplier</h2>
    <p>Adjust any recipe by scaling the ingredients up or down.</p>

    <label>Original Recipe Servings:</label>
    <input type="number" id="original" placeholder="E.g. 2 people">

    <label>New Servings:</label>
    <input type="number" id="new" placeholder="E.g. 5 people">

    <label>Ingredient Amount:</label>
    <input type="number" id="ingredient" placeholder="E.g. 100 grams">

    <button onclick="calculate()">Calculate 🍽️</button>

    <div class="result" id="result">Your adjusted amount will appear here.</div>
</div>

<footer>Made with ❤️ in the Kitchen</footer>

<script>
function calculate() {
    let original = parseFloat(document.getElementById("original").value);
    let newS = parseFloat(document.getElementById("new").value);
    let ing = parseFloat(document.getElementById("ingredient").value);

    if (!original || !newS || !ing) {
        document.getElementById("result").innerHTML = "Please fill all fields 🍴";
        return;
    }

    let adjusted = (newS / original) * ing;

    document.getElementById("result").innerHTML = 
        `You need <strong>${adjusted.toFixed(1)}</strong> units of this ingredient. 👨‍🍳`;
}
</script>

</body>
</html>
